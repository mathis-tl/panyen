version: 2

seeds:
  - name: ecsp_alimentation_2022
    description: >
      Mesure ECSP alimentaire de mars-avril 2022, grain
      (poste, territoire_compare, territoire_reference, periode_ancrage).
      Une seule ligne : écart de Fisher +40 % entre la Martinique (D972) et
      la France métropolitaine (FM). Cette valeur est une mesure sourcée,
      pas une estimation ni une constante SQL.
    config:
      column_types:
        periode_ancrage: date
        ecart_fisher_pct: double
    columns:
      - name: poste
        description: Poste de dépense comparé, alimentation.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["alimentation"]
      - name: territoire_compare
        description: Territoire comparé, Martinique (D972).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["D972"]
      - name: territoire_reference
        description: Territoire de référence, France métropolitaine (FM).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FM"]
      - name: periode_ancrage
        description: Ancre commune du calcul, 2022-04-01.
        data_tests:
          - not_null
      - name: ecart_fisher_pct
        description: Écart de Fisher alimentaire mesuré par l'ECSP, +40 %.
        data_tests:
          - not_null
      - name: methode
        description: Indice de Fisher, moyenne géométrique des deux paniers.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Fisher"]
      - name: periode_enquete
        description: Période d'enquête Insee, mars-avril 2022.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["mars-avril 2022"]
      - name: source_ecsp
        description: URL exacte de la publication Insee Analyses Martinique n° 63.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["https://www.insee.fr/fr/statistiques/7649202"]

  - name: prix_max_carburants_martinique
    description: >
      Seed réglementaire des plafonds martiniquais. Grain : (carburant_mq,
      debut_effet). 108 lignes d'avril 2022 à septembre 2026, provenance
      portée par reference_acte et url_source_primaire.
    config:
      column_types:
        debut_effet: date
        prix_max_eur_litre: decimal(12,4)
    columns:
      - name: debut_effet
        data_tests:
          - not_null
      - name: carburant_mq
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - gazole
                  - super_sans_plomb
      - name: prix_max_eur_litre
        data_tests:
          - not_null
      - name: reference_acte
        data_tests:
          - not_null
      - name: url_source_primaire
        data_tests:
          - not_null

  - name: evenements_contexte
    description: >
      Événements datés et sourcés qui éclairent les séries (mobilisations,
      mesures publiques, accords de prix, chocs extérieurs, études). Grain :
      (date_evenement, titre). Chaque ligne est vérifiée dans
      docs/analyse/validation.md. Contexte, jamais une mesure.
    config:
      column_types:
        date_evenement: date
        consulte_le: date
    columns:
      - name: date_evenement
        description: Date de l'événement ; premier jour du mois si precision_date = mois.
        data_tests:
          - not_null
      - name: precision_date
        description: Précision réelle de la date, sans en inventer davantage.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["jour", "mois"]
      - name: titre
        data_tests:
          - not_null
      - name: type_evenement
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mobilisation
                  - mesure_publique
                  - accord_prix
                  - choc_exterieur
                  - etude
      - name: postes_concernes
        description: >
          Postes séparés par « | » parmi alimentation, energie,
          produits_manufactures, services, ou « tous ».
        data_tests:
          - not_null
      - name: url_source
        description: URL exacte de la page ouverte et vérifiée.
        data_tests:
          - not_null
      - name: type_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["officielle", "presse", "etude", "partie_prenante"]
      - name: consulte_le
        description: Date de la vérification de la source.
        data_tests:
          - not_null

  - name: ecsp_niveaux
    description: >
      Écarts de niveau Martinique / France métropolitaine, indice de Fisher.
      Grain : (annee_enquete, poste). Mesures d'enquête uniquement, pas une
      estimation. L'alimentation 2022 y est à 40,2 % (Insee Première n° 1958) ;
      le seed ecsp_alimentation_2022.csv conserve 40,0, arrondi de la même
      mesure, et reste l'ancre de l'estimation mensuelle.
    config:
      column_types:
        annee_enquete: integer
        ecart_fisher_pct: double
        precision_pct: double
        consulte_le: date
    columns:
      - name: annee_enquete
        description: Année de l'enquête de comparaison spatiale.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2010, 2015, 2022]
      - name: poste
        description: Poste comparé, code stable.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ensemble
                  - alimentation
                  - communications
                  - meubles_entretien
                  - alcool_tabac
                  - sante
                  - logement
                  - transports
      - name: ecart_fisher_pct
        description: Écart de Fisher publié, en pourcentage.
        data_tests:
          - not_null
      - name: precision_pct
        description: >
          Pas de la décimale publiée : 0,1 si un chiffre après la virgule,
          1 si l'Insee arrondit à l'unité.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0.1, 1]
      - name: source_url
        description: Page Insee relue pour cette ligne.
        data_tests:
          - not_null
      - name: consulte_le
        description: Date de relecture de la page source.
        data_tests:
          - not_null
      - name: remarque
        description: >
          Limite de comparabilité ou écart d'arrondi, jamais un second chiffre.
        data_tests:
          - not_null

  - name: revenus_ecart_national
    description: >
      Écart des revenus martiniquais à la moyenne nationale, Île-de-France
      incluse. Grain : (annee, indicateur).
    config:
      column_types:
        annee: integer
        ecart_moyenne_nationale_pct: double
        consulte_le: date
    columns:
      - name: annee
        description: Millésime publié pour l'indicateur.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2023, 2024]
      - name: indicateur
        description: Indicateur de revenu.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - salaire_net_moyen_prive
                  - salaire_net_moyen_fonction_publique
                  - revenu_salarial
                  - revenu_activite_non_salaries
      - name: ecart_moyenne_nationale_pct
        description: Écart à la moyenne nationale, en pourcentage.
        data_tests:
          - not_null
      - name: source_url
        description: Page Insee relue pour cette ligne.
        data_tests:
          - not_null
      - name: consulte_le
        description: Date de relecture de la page source.
        data_tests:
          - not_null
      - name: champ
        description: Champ géographique de la moyenne de référence.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["moyenne nationale, Île-de-France incluse"]

  - name: ecsp_alimentation_formules
    description: >
      Écart alimentaire 2022 selon le panier de pondération (Paasche, panier
      martiniquais ; Laspeyres, panier hexagonal), encadrant le Fisher de 40 %.
      Grain : (annee_enquete, formule).
    config:
      column_types:
        annee_enquete: integer
        ecart_pct: double
        consulte_le: date
    columns:
      - name: annee_enquete
        description: Année de l'enquête de comparaison spatiale.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022]
      - name: formule
        description: Formule d'indice et panier de pondération.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - paasche_panier_martiniquais
                  - laspeyres_panier_hexagonal
      - name: ecart_pct
        description: Écart publié, en pourcentage.
        data_tests:
          - not_null
      - name: source_url
        description: Page Insee relue pour cette ligne.
        data_tests:
          - not_null
      - name: consulte_le
        description: Date de relecture de la page source.
        data_tests:
          - not_null
      - name: remarque
        description: Libellé et précision de la source.
        data_tests:
          - not_null
