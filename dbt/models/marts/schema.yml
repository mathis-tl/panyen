version: 2

models:
  - name: fct_differentiel_ipc
    description: >
      Différentiel d'évolution Martinique–France métropolitaine par poste,
      une ligne par (poste, periode). Joint les facteurs déjà rebasés
      intra-territoire et la mesure ECSP 2022 pour l'alimentation seulement.
      Aucun niveau d'indice brut n'est exposé. Aucune ancre ECSP hors
      alimentation.
    columns:
      - name: periode
        description: Premier jour du mois commun.
        data_tests:
          - not_null
      - name: dernier_mois_commun
        description: Dernier mois commun unique, partagé par les quatre postes.
        data_tests:
          - not_null
      - name: poste
        description: Poste de dépense snake_case.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - alimentation
                  - energie
                  - produits_manufactures
                  - services
      - name: libelle_poste
        description: Libellé d'affichage accentué du poste.
        data_tests:
          - not_null
      - name: fichier_source
        description: Fichier brut du lot quatre postes retenu.
        data_tests:
          - not_null
      - name: collecte_utc
        description: Horodatage UTC de collecte du fichier retenu.
        data_tests:
          - not_null
      - name: idbank_martinique
        description: Série martiniquaise du poste.
        data_tests:
          - not_null
      - name: idbank_france_metropolitaine
        description: Série métropolitaine du poste.
        data_tests:
          - not_null
      - name: facteur_martinique
        description: Facteur d'évolution martiniquais depuis avril 2022.
        data_tests:
          - not_null
      - name: facteur_france_metropolitaine
        description: Facteur d'évolution métropolitain depuis avril 2022.
        data_tests:
          - not_null
      - name: evolution_martinique_pct
        description: Évolution martiniquaise en %, intra-territoire.
        data_tests:
          - not_null
      - name: evolution_france_metropolitaine_pct
        description: Évolution métropolitaine en %, intra-territoire.
        data_tests:
          - not_null
      - name: differentiel_evolution_points
        description: >
          Différence des évolutions en points, pas une comparaison de niveaux.
        data_tests:
          - not_null
      - name: coefficient_ecart
        description: Rapport exact des deux facteurs, pas la différence des %.
        data_tests:
          - not_null
      - name: ancre_ecsp_disponible
        description: Vrai seulement si le seed ECSP a apparié (alimentation).
        data_tests:
          - not_null
      - name: ecart_ecsp_2022_pct
        description: >
          Mesure Fisher ECSP 2022 pour l'alimentation ; NULL sinon.
      - name: ecart_prix_estime_pct
        description: >
          Écart de prix estimé pour l'alimentation ; NULL hors ancre.
      - name: source_ecsp
        description: URL Insee de l'ECSP 2022 ; NULL hors alimentation.
      - name: nature_ecart
        description: >
          mesure_ecsp_2022 ou estimation_a_partir_ecsp_2022 pour
          l'alimentation ; NULL sinon.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - mesure_ecsp_2022
                  - estimation_a_partir_ecsp_2022

# Les indices des unit tests sont synthétiques, pas des données Insee.

unit_tests:
  - name: calcul_synthetique_coefficient_et_estimation
    description: >
      Calcul synthétique alimentation : facteurs, évolutions, différentiel,
      coefficient exact et estimation ECSP. Les indices sous-jacents sont fictifs.
    model: fct_differentiel_ipc
    given:
      - input: ref("int_ipc_rebase")
        format: sql
        rows: |
          select
            'data/raw/insee/ipc_synth.xml' as fichier_source,
            timestamptz '2026-09-01 00:00:00+00' as collecte_utc,
            'alimentation' as poste,
            '011813726' as idbank,
            'D972' as code_territoire,
            date '2022-05-01' as periode,
            date '2022-05-01' as dernier_mois_commun,
            1.25 as facteur,
            25.0 as evolution_pct
          union all
          select
            'data/raw/insee/ipc_synth.xml',
            timestamptz '2026-09-01 00:00:00+00',
            'alimentation',
            '011813720',
            'FM',
            date '2022-05-01',
            date '2022-05-01',
            1.0,
            0.0
          union all
          select
            'data/raw/insee/ipc_synth.xml',
            timestamptz '2026-09-01 00:00:00+00',
            'energie',
            '011813873',
            'D972',
            date '2022-05-01',
            date '2022-05-01',
            1.1,
            10.0
          union all
          select
            'data/raw/insee/ipc_synth.xml',
            timestamptz '2026-09-01 00:00:00+00',
            'energie',
            '011813867',
            'FM',
            date '2022-05-01',
            date '2022-05-01',
            1.05,
            5.0
      - input: ref("ecsp_alimentation_2022")
        format: sql
        rows: |
          select
            'alimentation' as poste,
            'D972' as territoire_compare,
            'FM' as territoire_reference,
            date '2022-04-01' as periode_ancrage,
            40.0 as ecart_fisher_pct,
            'https://www.insee.fr/fr/statistiques/7649202' as source_ecsp
    expect:
      format: sql
      rows: |
        select
          date '2022-05-01' as periode,
          date '2022-05-01' as dernier_mois_commun,
          'alimentation' as poste,
          'Alimentation' as libelle_poste,
          'data/raw/insee/ipc_synth.xml' as fichier_source,
          timestamptz '2026-09-01 00:00:00+00' as collecte_utc,
          '011813726' as idbank_martinique,
          '011813720' as idbank_france_metropolitaine,
          1.25 as facteur_martinique,
          1.0 as facteur_france_metropolitaine,
          25.0 as evolution_martinique_pct,
          0.0 as evolution_france_metropolitaine_pct,
          25.0 as differentiel_evolution_points,
          1.25 as coefficient_ecart,
          true as ancre_ecsp_disponible,
          40.0 as ecart_ecsp_2022_pct,
          ((1 + 40.0 / 100) * 1.25 - 1) * 100 as ecart_prix_estime_pct,
          'https://www.insee.fr/fr/statistiques/7649202' as source_ecsp,
          'estimation_a_partir_ecsp_2022' as nature_ecart
        union all
        select
          date '2022-05-01',
          date '2022-05-01',
          'energie',
          'Énergie',
          'data/raw/insee/ipc_synth.xml',
          timestamptz '2026-09-01 00:00:00+00',
          '011813873',
          '011813867',
          1.1,
          1.05,
          10.0,
          5.0,
          5.0,
          1.1 / 1.05,
          false,
          cast(null as double),
          cast(null as double),
          cast(null as varchar),
          cast(null as varchar)

  - name: identites_de_l_ancre
    description: >
      Ligne d'ancre synthétique alimentation : facteurs 1, écart 40, nature
      mesure_ecsp_2022.
    model: fct_differentiel_ipc
    given:
      - input: ref("int_ipc_rebase")
        format: sql
        rows: |
          select
            'data/raw/insee/ipc_synth.xml' as fichier_source,
            timestamptz '2026-09-01 00:00:00+00' as collecte_utc,
            'alimentation' as poste,
            '011813726' as idbank,
            'D972' as code_territoire,
            date '2022-04-01' as periode,
            date '2022-04-01' as dernier_mois_commun,
            1.0 as facteur,
            0.0 as evolution_pct
          union all
          select
            'data/raw/insee/ipc_synth.xml',
            timestamptz '2026-09-01 00:00:00+00',
            'alimentation',
            '011813720',
            'FM',
            date '2022-04-01',
            date '2022-04-01',
            1.0,
            0.0
      - input: ref("ecsp_alimentation_2022")
        format: sql
        rows: |
          select
            'alimentation' as poste,
            'D972' as territoire_compare,
            'FM' as territoire_reference,
            date '2022-04-01' as periode_ancrage,
            40.0 as ecart_fisher_pct,
            'https://www.insee.fr/fr/statistiques/7649202' as source_ecsp
    expect:
      format: sql
      rows: |
        select
          date '2022-04-01' as periode,
          date '2022-04-01' as dernier_mois_commun,
          'alimentation' as poste,
          'Alimentation' as libelle_poste,
          'data/raw/insee/ipc_synth.xml' as fichier_source,
          timestamptz '2026-09-01 00:00:00+00' as collecte_utc,
          '011813726' as idbank_martinique,
          '011813720' as idbank_france_metropolitaine,
          1.0 as facteur_martinique,
          1.0 as facteur_france_metropolitaine,
          0.0 as evolution_martinique_pct,
          0.0 as evolution_france_metropolitaine_pct,
          0.0 as differentiel_evolution_points,
          1.0 as coefficient_ecart,
          true as ancre_ecsp_disponible,
          40.0 as ecart_ecsp_2022_pct,
          ((1 + 40.0 / 100) * 1.0 - 1) * 100 as ecart_prix_estime_pct,
          'https://www.insee.fr/fr/statistiques/7649202' as source_ecsp,
          'mesure_ecsp_2022' as nature_ecart
