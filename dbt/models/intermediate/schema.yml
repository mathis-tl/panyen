version: 2

models:
  - name: int_ipc_alimentation_rebase
    description: >
      Rebasage intra-territoire des indices alimentaires du dernier lot
      métropolitain. Grain : une ligne par (fichier_source, idbank, periode)
      de l'ancre 2022-04-01 au dernier mois commun inclus. Les niveaux d'indice
      ne sont jamais comparés entre territoires ; un mois interne absent ou ND
      reste visible avec un calcul nul.
    columns:
      - name: fichier_source
        description: Fichier brut métropolitain retenu, comme unité indivisible.
        data_tests:
          - not_null
      - name: collecte_utc
        description: Horodatage UTC de collecte lu dans le nom du fichier retenu.
        data_tests:
          - not_null
      - name: idbank
        description: Identifiant Insee de la série, 011813726 ou 011813720.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["011813726", "011813720"]
      - name: code_territoire
        description: Territoire de la série, D972 ou FM, jamais apparié en niveau.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["D972", "FM"]
      - name: perimetre_reference
        description: Périmètre du lot actif, exclusivement france_metropolitaine.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["france_metropolitaine"]
      - name: periode
        description: Premier jour du mois d'observation, dans le calendrier fermé.
        data_tests:
          - not_null
      - name: dernier_mois_commun
        description: Plus ancien des derniers mois valides de D972 et de FM.
        data_tests:
          - not_null
      - name: valeur_indice
        description: >
          Niveau brut intra-territoire, conservé pour la traçabilité. Nul si le
          mois est absent ou ND : le test not_null échoue alors volontairement,
          sans interpolation. Ne jamais le comparer à l'autre territoire.
        data_tests:
          - not_null
      - name: statut_observation
        description: >
          Statut SDMX conservé. ND reste ND ; un mois absent reste nul et fait
          échouer le test not_null.
        data_tests:
          - not_null
      - name: facteur
        description: >
          indice(t) / indice(2022-04) calculé uniquement dans le même territoire.
          Nul si l'ancre ou le mois est invalide ; le test not_null échoue alors.
        data_tests:
          - not_null
      - name: evolution_pct
        description: >
          (facteur - 1) * 100, toujours intra-territoire. Nul si le facteur l'est,
          et le test not_null échoue alors.
        data_tests:
          - not_null

# Les valeurs des unit tests sont explicitement synthétiques.
# Elles ne sont pas des données Insee et ne doivent jamais être
# présentées comme telles.

unit_tests:
  - name: selectionne_le_fichier_metropolitain_le_plus_recent_en_entier
