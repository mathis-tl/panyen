version: 2

models:
  - name: int_ipc_rebase
    description: >
      Rebasage intra-territoire et intra-poste des indices du dernier lot
      quatre_postes_france_metropolitaine. Grain : une ligne par (poste,
      idbank, periode) de l'ancre 2022-04-01 au dernier mois commun inclus.
      Les niveaux d'indice ne sont jamais comparés entre territoires.
    columns:
      - name: fichier_source
        description: Fichier brut quatre postes retenu, comme unité indivisible.
        data_tests:
          - not_null
      - name: collecte_utc
        description: Horodatage UTC de collecte lu dans le nom du fichier retenu.
        data_tests:
          - not_null
      - name: poste
        description: Poste de dépense snake_case.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - alimentation
                  - energie
                  - produits_manufactures
                  - services
      - name: idbank
        description: Identifiant Insee de la série active.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "011813726"
                  - "011813720"
                  - "011813873"
                  - "011813867"
                  - "011813789"
                  - "011813783"
                  - "011813915"
                  - "011813909"
      - name: code_territoire
        description: Territoire de la série, D972 ou FM, jamais apparié en niveau.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["D972", "FM"]
      - name: lot_collecte
        description: Lot actif, exclusivement quatre_postes_france_metropolitaine.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["quatre_postes_france_metropolitaine"]
      - name: perimetre_reference
        description: Périmètre du lot actif, exclusivement france_metropolitaine.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["france_metropolitaine"]
      - name: periode
        description: Premier jour du mois d'observation, dans le calendrier fermé.
        data_tests:
          - not_null
      - name: dernier_mois_commun
        description: Minimum des derniers mois valides des huit séries.
        data_tests:
          - not_null
      - name: valeur_indice
        description: >
          Niveau brut intra-territoire, conservé pour la traçabilité. Ne jamais
          le comparer à l'autre territoire. Un mois absent ou ND laisserait un
          nul dans la grille : le test not_null le fait échouer bruyamment au
          lieu de le combler.
        data_tests:
          - not_null
      - name: statut_observation
        description: Statut SDMX conservé.
        data_tests:
          - not_null
      - name: facteur
        description: >
          indice(t) / indice(2022-04) calculé uniquement dans le même territoire
          et le même poste.
        data_tests:
          - not_null
      - name: evolution_pct
        description: (facteur - 1) * 100, toujours intra-territoire et intra-poste.
        data_tests:
          - not_null

