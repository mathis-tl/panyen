version: 2

models:
  - name: int_carburant_station_periode
    description: >
      Moyenne par station pondérée par la durée d'affichage sur chaque période
      d'effet du plafond martiniquais (gazole). Grain :
      (debut_effet, id_station, carburant_national).
    columns:
      - name: debut_effet
        description: Date d'effet inclusive de la période (fuseau Martinique).
        data_tests:
          - not_null
      - name: id_station
        data_tests:
          - not_null
      - name: carburant_national
        data_tests:
          - not_null
      - name: prix_eur_litre
        description: Moyenne pondérée en euros par litre sur la période.
        data_tests:
          - not_null

  - name: int_ipc_rebase
    description: >
      Rebasage intra-territoire et intra-poste des indices du dernier lot
      cinq_postes_france_metropolitaine (dix séries). Grain : une ligne par
      (poste, idbank, periode) de l'ancre 2022-04-01 au dernier mois commun inclus.
      Les niveaux d'indice ne sont jamais comparés entre territoires.
    columns:
      - name: fichier_source
        description: Fichier brut cinq postes retenu, comme unité indivisible.
        data_tests:
          - not_null
      - name: collecte_utc
        description: Horodatage UTC de collecte lu dans le nom du fichier retenu.
        data_tests:
          - not_null
      - name: poste
        description: Poste de dépense snake_case.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - alimentation
                  - energie
                  - produits_manufactures
                  - services
                  - ensemble
      - name: idbank
        description: Identifiant Insee de la série active.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "011813726"
                  - "011813720"
                  - "011813873"
                  - "011813867"
                  - "011813789"
                  - "011813783"
                  - "011813915"
                  - "011813909"
                  - "011814618"
                  - "011814612"
      - name: code_territoire
        description: Territoire de la série, D972 ou FM, jamais apparié en niveau.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["D972", "FM"]
      - name: lot_collecte
        description: Lot actif, exclusivement cinq_postes_france_metropolitaine.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["cinq_postes_france_metropolitaine"]
      - name: perimetre_reference
        description: Périmètre du lot actif, exclusivement france_metropolitaine.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["france_metropolitaine"]
      - name: periode
        description: Premier jour du mois d'observation, dans le calendrier fermé.
        data_tests:
          - not_null
      - name: dernier_mois_commun
        description: Minimum des derniers mois valides des dix séries.
        data_tests:
          - not_null
      - name: valeur_indice
        description: >
          Niveau brut intra-territoire, conservé pour la traçabilité. Ne jamais
          le comparer à l'autre territoire. Un mois absent ou ND laisserait un
          nul dans la grille : le test not_null le fait échouer bruyamment au
          lieu de le combler.
        data_tests:
          - not_null
      - name: statut_observation
        description: Statut SDMX conservé.
        data_tests:
          - not_null
      - name: facteur
        description: >
          indice(t) / indice(2022-04) calculé uniquement dans le même territoire
          et le même poste.
        data_tests:
          - not_null
      - name: evolution_pct
        description: (facteur - 1) * 100, toujours intra-territoire et intra-poste.
        data_tests:
          - not_null

# Les valeurs des unit tests sont explicitement synthétiques.

unit_tests:
  - name: periode_prix_unique_station
    description: Un seul prix sur toute la période — moyenne = ce prix. Synthétique.
    model: int_carburant_station_periode
    given:
      - input: ref("stg_correspondance_carburants")
        rows:
          - {
              carburant_mq: gazole,
              libelle_mq: Gazole,
              carburant_national: Gazole,
              libelle_national: Gazole,
              statut_comparabilite: directe,
              url_justification: "",
              note: "",
            }
      - input: ref("fct_prix_max_mq")
        rows:
          - {
              carburant_mq: gazole,
              debut_effet: 2024-01-01,
              fin_effet_exclusive: 2024-02-01,
              libelle_source: test,
              prix_max_eur_litre: 1.90,
              reference_acte: TEST,
              url_source_primaire: https://example.test,
              pages_acte: null,
            }
      - input: ref("fct_carburant_station")
        format: sql
        rows: |
          select
            'S1' as id_station,
            'Gazole' as carburant_national,
            timestamptz '2024-01-15 12:00:00+00' as releve_utc,
            1.50::double as prix_eur_litre,
            '75001' as code_postal,
            'test.xml' as fichier_source,
            'abc' as sha256_source,
            timestamptz '2024-01-01 00:00:00+00' as collecte_utc,
            'zip' as membre_zip
    expect:
      rows:
        - {
            debut_effet: 2024-01-01,
            id_station: S1,
            carburant_national: Gazole,
            prix_eur_litre: 1.50,
          }

