version: 2

models:
  - name: stg_insee_carburants
    description: >
      Prix moyen mensuel Insee du gazole en France métropolitaine (idbank
      000442588), issu des XML bruts insee_carburants_*.xml. Grain :
      (fichier_source, idbank, periode).
    columns:
      - name: fichier_source
        data_tests:
          - not_null
      - name: collecte_utc
        data_tests:
          - not_null
      - name: idbank
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["000442588"]
      - name: periode
        data_tests:
          - not_null
      - name: prix_moyen_eur_litre
        data_tests:
          - not_null

  - name: stg_ipc
    description: >
      Observations mensuelles des indices IPC Insee (quatre postes actifs,
      plus les lots alimentaires historiques), issues des XML SDMX bruts.
      Grain : une observation par (fichier_source, idbank, periode). Cette
      table ne compare pas les niveaux d'indice entre territoires.
    columns:
      - name: fichier_source
        description: Chemin relatif stable du XML brut dans le dépôt.
        data_tests:
          - not_null
      - name: collecte_utc
        description: Horodatage UTC lu exclusivement dans le nom du fichier brut.
        data_tests:
          - not_null
      - name: idbank
        description: Identifiant Insee de la série, conservé en chaîne avec son zéro initial.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "011813726"
                  - "011813717"
                  - "011813720"
                  - "011813873"
                  - "011813867"
                  - "011813789"
                  - "011813783"
                  - "011813915"
                  - "011813909"
      - name: poste
        description: Poste de dépense snake_case déduit de l'idbank.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - alimentation
                  - energie
                  - produits_manufactures
                  - services
      - name: code_territoire
        description: >
          Code SDMX REF_AREA de la série. Correspondances exactes du
          référentiel idbank → territoire.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["D972", "FE", "FM"]
      - name: lot_collecte
        description: >
          Lot déduit du préfixe et de l'ensemble d'idbanks du fichier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - alimentation_france_entiere
                  - alimentation_france_metropolitaine
                  - quatre_postes_france_metropolitaine
      - name: perimetre_reference
        description: >
          Périmètre géographique de référence du lot.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["france_entiere_historique", "france_metropolitaine"]
      - name: frequence
        description: Fréquence SDMX de la série ; seule la fréquence mensuelle M est acceptée.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["M"]
      - name: titre
        description: Titre de la série tel que publié par l'Insee.
        data_tests:
          - not_null
      - name: mise_a_jour_source
        description: Attribut LAST_UPDATE de la série, conservé tel quel.
        data_tests:
          - not_null
      - name: unite_mesure
        description: Unité de mesure SDMX de la série.
        data_tests:
          - not_null
      - name: multiplicateur_unite
        description: Multiplicateur d'unité SDMX (UNIT_MULT), entier.
        data_tests:
          - not_null
      - name: decimales
        description: Nombre de décimales déclaré par la source.
        data_tests:
          - not_null
      - name: periode
        description: Premier jour du mois d'observation (TIME_PERIOD).
        data_tests:
          - not_null
      - name: valeur_indice
        description: >
          Valeur numérique de l'indice. Nulle uniquement si l'observation est
          explicitement indisponible (OBS_STATUS = ND).
      - name: statut_observation
        description: Statut SDMX OBS_STATUS, conservé sans correction.
        data_tests:
          - not_null
      - name: qualite_observation
        description: Qualité SDMX OBS_QUAL, conservée sans correction.
        data_tests:
          - not_null
      - name: type_observation
        description: Type SDMX OBS_TYPE, conservé sans correction.
        data_tests:
          - not_null

  - name: stg_carburants
    description: >
      Relevés nationaux bruts après parsing ZIP/XML. Grain : (fichier_source,
      membre_zip, id_station, carburant_national, releve_utc). Métropole
      seulement (filtre code postal) ; aucune enseigne.
    columns:
      - name: fichier_source
        description: Chemin relatif du ZIP brut.
        data_tests:
          - not_null
      - name: sha256_source
        data_tests:
          - not_null
      - name: collecte_utc
        data_tests:
          - not_null
      - name: membre_zip
        data_tests:
          - not_null
      - name: id_station
        data_tests:
          - not_null
      - name: carburant_national
        data_tests:
          - not_null
      - name: releve_utc
        data_tests:
          - not_null
      - name: prix_eur_litre
        data_tests:
          - not_null

  - name: stg_arretes
    description: >
      Actes réglementaires martiniquais depuis le seed sourcé. Grain :
      (carburant_mq, debut_effet).
    columns:
      - name: debut_effet
        description: Date d'effet inclusive du plafond.
        data_tests:
          - not_null
      - name: carburant_mq
        description: Identifiant réglementaire martiniquais.
        data_tests:
          - not_null
      - name: prix_max_eur_litre
        data_tests:
          - not_null
      - name: reference_acte
        data_tests:
          - not_null
      - name: url_source_primaire
        data_tests:
          - not_null

  - name: stg_correspondance_carburants
    description: >
      Manifeste versionné des équivalences produit. Grain : (carburant_mq,
      carburant_national). Seules les lignes directe alimentent la comparaison.
    columns:
      - name: carburant_mq
        data_tests:
          - not_null
      - name: carburant_national
        data_tests:
          - not_null
      - name: statut_comparabilite
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - directe
                  - non_comparable
      - name: url_justification
        data_tests:
          - not_null
      - name: note
        data_tests:
          - not_null
